# ============================================
# NGINX Reverse Proxy (Docker)
# - Lives in the backend container
# - Listens on :8080
# - Proxies to NestJS on 127.0.0.1:3000
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;
    default_type    application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  logs/access-docker.log  main;
    error_log   logs/error-docker.log   warn;

    upstream nest_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Simple health endpoint for curl checks
        location = /health {
            proxy_pass http://nest_backend/health;
        }

        location / {
            proxy_http_version 1.1;

            proxy_pass http://nest_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout      60s;
            proxy_connect_timeout   5s;
            proxy_send_timeout      60s;
        }
    }
}
