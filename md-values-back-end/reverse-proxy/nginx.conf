# ============================================
# NGINX Reverse Proxy
# - Sits in front of NestJS
# - Listens on :8080
# - Proxies to :3000
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Basic HTTP settings
    sendfile        on;
    keepalive_timeout 65;

    # Minimal, no external mime.types needed
    default_type  application/octet-stream;

    # Simple log formats (tune as needed)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  logs/access.log  main;
    error_log   logs/error.log   warn;

    # --- Backend upstream (NestJS on 3000) ---
    upstream nest_backend {
        server 127.0.0.1:3000;
        # In prod you could add:
        # keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Optional: simple health endpoint (useful for curl checks)
        location = /health {
            proxy_pass http://nest_backend/health;
        }

        # Main API pass-through
        location / {
            proxy_http_version 1.1;

            # Pass through to NestJS
            proxy_pass http://nest_backend;

            # Standard headers so backend sees real client info
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reasonable timeouts for dev
            proxy_read_timeout      60s;
            proxy_connect_timeout   5s;
            proxy_send_timeout      60s;
        }
    }
}
