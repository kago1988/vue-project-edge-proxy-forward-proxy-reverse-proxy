# ============================================
# NGINX Forward Proxy (Docker)
# - Lives in the frontend container
# - Listens on :3128
# - Forwards to host.docker.internal:8080 (backend reverse proxy)
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;
    default_type    application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  logs/access-docker.log  main;
    error_log   logs/error-docker.log   warn;

    server {
        listen 3128;
        server_name localhost;

        # Optional: simple health check for curl
        location = /health {
            return 200 "forward-proxy (docker) ok\n";
        }

        location / {
            proxy_http_version 1.1;

            # Talk to the host’s reverse proxy port, which maps to mv-backend:8080
            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout      60s;
            proxy_connect_timeout   5s;
            proxy_send_timeout      60s;
        }
    }
}
