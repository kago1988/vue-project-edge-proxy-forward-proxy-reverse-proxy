# ============================================
# NGINX Forward Hop (Dev)
# - Sits next to the frontend
# - Listens on :3128
# - Forwards to the backend (or reverse proxy)
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile        on;
    keepalive_timeout 65;

    # Just use a default mime type; no external mime.types file needed
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  logs/access.log  main;
    error_log   logs/error.log   warn;

    server {
        listen 3128;
        server_name localhost;

        # Optional: quick health probe
        location = /health {
            return 200 "forward-proxy ok\n";
        }

        # Forward everything to the backend (right now directly to NestJS)
        location / {
            proxy_http_version 1.1;

            proxy_pass http://127.0.0.1:8080;
            # later you can change that to 8080 if you put a reverse proxy in between

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout      60s;
            proxy_connect_timeout   5s;
            proxy_send_timeout      60s;
        }
    }
}
