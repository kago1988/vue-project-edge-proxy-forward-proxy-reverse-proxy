# ============================================
# HTTPS edge proxy
# https://mdvalues.test/           → Angular on 4200
# https://mdvalues.test/api/...    → API via forward proxy on 3128
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log logs/mdvalues-access.log main;
    error_log  logs/mdvalues-error.log warn;

    server {
        listen 443 ssl;
        server_name mdvalues.test;

        ssl_certificate     ssl/mdvalues.test.pem;
        ssl_certificate_key ssl/mdvalues.test-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ---- API: go through your forward proxy on 3128 ----
        location /api/ {
            proxy_http_version 1.1;

            # Forward to forward-proxy (which in turn talks to 8080 → 3000)
            proxy_pass http://127.0.0.1:3128/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Everything else: Angular build on 4200 ----
        location / {
            proxy_pass http://127.0.0.1:4200;
            proxy_set_header Host $host;
        }
    }
}
