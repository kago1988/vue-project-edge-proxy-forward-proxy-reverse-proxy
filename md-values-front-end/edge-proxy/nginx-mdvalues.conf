# ============================================
# HTTPS → Angular (dev) binding
# https://mdvalues.test  →  http://localhost:4200
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log logs/mdvalues-access.log main;
    error_log  logs/mdvalues-error.log warn;

    upstream angular_dev {
        server 127.0.0.1:4200;
        # or: server localhost:4200;
    }

    server {
        listen 443 ssl;
        server_name mdvalues.test;

        ssl_certificate     ssl/mdvalues.test.pem;
        ssl_certificate_key ssl/mdvalues.test-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Simple HTTPS health check
        location = /health {
            return 200 "mdvalues edge ok\n";
        }

        # Map everything to Angular dev server
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://angular_dev;
        }
    }
}
